name: Python unit tests

on:
  push:
    branches: [practice-testing]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run unit tests
        working-directory: testing-practice
        run: python -m unittest -v